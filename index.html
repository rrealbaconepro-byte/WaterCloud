<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💧 WaterCloud</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{display:flex;height:100vh;background:#0f172a;color:#fff}
    aside{width:220px;background:#111827;padding:20px}
    .logo{font-size:24px;font-weight:bold;color:#67e8f9;margin-bottom:20px}
    aside button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:10px;background:#1f2937;color:#fff;cursor:pointer}
    aside button:hover,.active{background:#0ea5e9}
    main{flex:1;padding:20px;overflow:auto}
    .page{display:none}
    .show{display:block}
    .card{background:#172033;padding:18px;border-radius:14px;margin-top:15px}
    .service{background:#1e293b;padding:14px;border-radius:10px;margin:8px 0;cursor:pointer}
    .service:hover{outline:1px solid #38bdf8}
    .btn{background:#0ea5e9;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer}
    input,textarea{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#111827;color:#fff}
    .mail{display:flex;height:65vh}
    .list{width:260px;border-right:1px solid #263244}
    .item{padding:12px;border-bottom:1px solid #1f2937;cursor:pointer}
    .item:hover{background:#1b2637}
    .reader{flex:1;padding:15px}
    .file{display:flex;justify-content:space-between;align-items:center;background:#111827;padding:10px;border-radius:8px;margin-top:8px}
    .progress{height:16px;background:#1f2937;border-radius:20px;overflow:hidden;margin:10px 0}
    .bar{height:100%;background:#38bdf8;width:0}
    #modal{position:fixed;inset:0;background:#0008;display:none;justify-content:center;align-items:center}
    .modal{background:#172033;padding:20px;border-radius:14px;width:320px}
  </style>
</head>
<body>

<aside>
  <div class="logo">💧 WaterCloud</div>

  <button class="active" onclick="show('home',this)">Home</button>
  <button onclick="show('mail',this)">Mail</button>
  <button onclick="show('files',this)">Files</button>
  <button onclick="show('notes',this)">Notes</button>
  <button onclick="show('settings',this)">Settings</button>
</aside>

<main>

  <!-- HOME -->
  <section id="home" class="page show">
    <h1>Welcome to WaterCloud</h1>
    <p>Connect your email provider.</p>

    <div class="card">
      <div class="service" onclick="openConnect('Gmail')">📨 Gmail</div>
      <div class="service" onclick="openConnect('Apple Mail')"> Apple Mail</div>
      <div class="service" onclick="openConnect('Outlook')">📩 Outlook</div>
      <div class="service" onclick="openConnect('IMAP')">🌐 IMAP</div>

      <p id="status"></p>
    </div>
  </section>

  <!-- MAIL -->
  <section id="mail" class="page">
    <h1>Mail</h1>

    <div id="emptyMail" class="card">
      <h2>No email connected</h2>
      <p>Connect an email to view your inbox.</p>
      <br>
      <button class="btn" onclick="show('home',document.querySelectorAll('aside button')[0])">
        Connect an Email
      </button>
    </div>

    <div id="mailUI" class="card mail" style="display:none">
      <div id="mailList" class="list"></div>
      <div id="reader" class="reader"></div>
    </div>
  </section>

  <!-- FILES -->
  <section id="files" class="page">
    <h1>Files</h1>

    <div class="card">
      <input type="file" id="picker">
      <button class="btn" onclick="upload()">Upload</button>

      <div class="progress">
        <div id="bar" class="bar"></div>
      </div>

      <p id="storage"></p>

      <div id="filesList"></div>
    </div>
  </section>

  <!-- NOTES -->
  <section id="notes" class="page">
    <h1>Notes</h1>

    <div class="card">
      <input id="title" placeholder="Title">
      <textarea id="note" rows="10" placeholder="Write notes..."></textarea>

      <button class="btn" onclick="saveNote()">Save</button>

      <p id="saved"></p>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h1>Settings</h1>

    <div class="card">
      <p><b>Provider:</b> <span id="providerLabel">None</span></p>
      <p><b>Email:</b> <span id="emailLabel">Not connected</span></p>
    </div>
  </section>

</main>

<!-- CONNECT MODAL -->
<div id="modal">
  <div class="modal">
    <h3 id="modalTitle">Connect Email</h3>

    <input id="emailInput" placeholder="you@example.com">

    <button class="btn" onclick="connect()">Confirm</button>
    <button class="btn" style="background:#374151;margin-top:8px" onclick="modal.style.display='none'">
      Cancel
    </button>
  </div>
</div>

<script>
let provider="", email="", connected=false;

const emails=[
  {from:"Alex",sub:"Landing Page",body:"Review the project."},
  {from:"Emma",sub:"Design Update",body:"New design uploaded."},
  {from:"GitHub",sub:"PR Merged",body:"WaterCloud merged."}
];

function show(id,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  document.getElementById(id).classList.add("show");
  document.querySelectorAll("aside button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  renderMail();
}

function openConnect(name){
  provider=name;
  modal.style.display="flex";
  modalTitle.textContent="Connect "+name;
}

function connect(){
  if(!emailInput.value) return alert("Enter an email");
  email=emailInput.value;
  connected=true;

  status.textContent="Connected as "+email;
  providerLabel.textContent=provider;
  emailLabel.textContent=email;

  modal.style.display="none";
  renderMail();
}

function renderMail(){
  if(!connected){
    emptyMail.style.display="block";
    mailUI.style.display="none";
    return;
  }

  emptyMail.style.display="none";
  mailUI.style.display="flex";

  mailList.innerHTML="";

  emails.forEach(m=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML="<b>"+m.from+"</b><br>"+m.sub;

    div.onclick=()=>{
      reader.innerHTML=
        "<h2>"+m.sub+"</h2><p>From: "+m.from+"</p><br>"+m.body;
    };

    mailList.appendChild(div);
  });

  mailList.firstChild.click();
}

const MAX=2048;
let files=[];

function upload(){
  const f=picker.files[0];
  if(!f) return;

  const r=new FileReader();

  r.onload=e=>{
    files.push({
      name:f.name,
      size:f.size/1048576,
      data:e.target.result
    });

    updateStorage();
    renderFiles();
  };

  r.readAsDataURL(f);
}

function renderFiles(){
  filesList.innerHTML="";

  files.forEach((f,i)=>{
    const row=document.createElement("div");
    row.className="file";

    row.innerHTML=
      "<div><b>"+f.name+"</b><br>"+f.size.toFixed(2)+" MB</div>";

    const actions=document.createElement("div");

    const dl=document.createElement("button");
    dl.className="btn";
    dl.textContent="Download";
    dl.onclick=()=>{
      const a=document.createElement("a");
      a.href=f.data;
      a.download=f.name;
      a.click();
    };

    const del=document.createElement("button");
    del.className="btn";
    del.style.background="#dc2626";
    del.textContent="Delete";
    del.onclick=()=>{
      files.splice(i,1);
      updateStorage();
      renderFiles();
    };

    actions.append(dl,del);
    row.appendChild(actions);
    filesList.appendChild(row);
  });
}

function updateStorage(){
  const used=files.reduce((a,b)=>a+b.size,0);
  const pct=(used/MAX)*100;

  bar.style.width=pct+"%";
  storage.textContent=used.toFixed(2)+" MB used of 2 TB";
}

function saveNote(){
  localStorage.setItem("note",JSON.stringify({
    title:title.value,
    body:note.value
  }));

  saved.textContent="Saved!";
}

renderMail();
updateStorage();
</script>

</body>
</html>
